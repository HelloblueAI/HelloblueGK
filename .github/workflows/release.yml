name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '9.0.x'
    
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Build PlasticityDemo
      run: |
        cd PlasticityDemo
        dotnet build --configuration Release
        dotnet publish --configuration Release --output ./publish
    
    - name: Generate design files
      run: |
        python3 Scripts/Integration/open_in_plasticity.py
    
    - name: Create release package
      run: |
        mkdir -p release
        cp -r PlasticityDemo/publish/* release/
        # The generator writes into Docs/Designs/<engine>/; the previous glob looked for
        # HB-NLP-REV-001* in the repository root, where nothing has ever been written, so
        # every tagged release failed here.
        cp -r Docs/Designs/HB-NLP-REV-001 release/
        cp Scripts/Integration/open_in_plasticity.py release/
        cp README.md release/
        cp LICENSE release/
        
        # Create zip archive
        zip -r hellobluegk-release-${{ github.ref_name }}.zip release/
    
    # actions/create-release and actions/upload-release-asset were both archived by
    # GitHub and are unmaintained. gh is preinstalled on the runner, so the release and
    # its asset can be created in one step with no third-party action.
    - name: Create release and upload asset
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cat > release-notes.md <<'NOTES'
        ## HelloblueGK Community Edition ${{ github.ref_name }}

        Open-source aerospace engine simulation reference stack (.NET 9).

        This release is the **Community Edition** — useful for research, integration,
        and education. It is **not** a flight-certified or mission-ready package.
        See [OPEN_SOURCE_SCOPE.md](https://github.com/HelloblueAI/HelloblueGK/blob/main/OPEN_SOURCE_SCOPE.md).

        ### Included
        - PlasticityDemo publish output
        - Sample engine design files / scripts
        - README and Apache 2.0 license

        ### Quick start
        ```bash
        unzip hellobluegk-release-${{ github.ref_name }}.zip
        cd release
        dotnet PlasticityDemo.dll
        ```

        For production/enterprise needs, contact Helloblue — do not treat this
        repository alone as regulatory or flight evidence.
        NOTES

        gh release create "${{ github.ref_name }}" \
          "hellobluegk-release-${{ github.ref_name }}.zip#hellobluegk-release-${{ github.ref_name }}.zip" \
          --title "HelloblueGK Community Edition ${{ github.ref_name }}" \
          --notes-file release-notes.md
