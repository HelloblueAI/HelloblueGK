# Example Kubernetes deployment for the HelloblueGK Community Edition.
#
# This is an illustrative starting point, not a validated or supported path. It is
# not exercised by CI. Render is the supported deployment path and is described in
# Docs/Deployment/DEPLOY_TO_RENDER.md.
#
# Before applying, replace every PLACEHOLDER value and create the referenced secret:
#
#   kubectl create secret generic hellobluegk \
#     --from-literal=jwt-key="$(openssl rand -base64 48)" \
#     --from-literal=database-connection="Host=...;Database=...;Username=...;Password=..."
#
# Resource requests, replica counts, storage classes, and ingress settings below are
# deliberately minimal. Size them for your own cluster and workload.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hellobluegk-api
  labels:
    app: hellobluegk-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hellobluegk-api
  template:
    metadata:
      labels:
        app: hellobluegk-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: hellobluegk-api
          # Build from Docker/Dockerfile and push to a registry you control.
          image: PLACEHOLDER_REGISTRY/hellobluegk:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: hellobluegk
                  key: jwt-key
            - name: ConnectionStrings__PostgreSQLConnection
              valueFrom:
                secretKeyRef:
                  name: hellobluegk
                  key: database-connection
            - name: Jwt__Issuer
              value: "https://api.example.com"
            - name: Jwt__Audience
              value: "https://app.example.com"
            - name: Cors__Origins
              value: "https://app.example.com"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /Health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /Health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: hellobluegk-api
  labels:
    app: hellobluegk-api
spec:
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      name: http
  selector:
    app: hellobluegk-api

---
# Requires an ingress controller and, for TLS, a certificate issuer in your cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hellobluegk-api
spec:
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hellobluegk-api
                port:
                  number: 80
