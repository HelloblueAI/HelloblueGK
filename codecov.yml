codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "46...100"

  # These targets drive the Codecov dashboard and PR comments only. They are NOT the
  # enforced floors: Codecov accepts this project's uploads but has never successfully
  # processed one, leaving every commit in an error state with an empty report, so a
  # floor expressed only here is enforced by nothing.
  #
  # The authoritative, CI-enforced floors live in
  # Certification/Artifacts/coverage-floors.json and are checked by Tools/CertificationGate
  # against the Cobertura report from the same run. Keep the two in step when raising a
  # floor, and treat the JSON as the source of truth.
  status:
    project:
      default:
        target: 46%
        threshold: 1%
        base: auto

      # Certification code carries the DO-178C / NPR 7150.2 evidence gates, so it is
      # held to its own floor. The global target would let it regress ~50 points
      # without failing anything.
      certification:
        paths:
          - "Certification/"
        target: 90%
        threshold: 1%
        base: auto

      webapi:
        paths:
          - "WebAPI/"
        target: 60%
        threshold: 1%
        base: auto

      core:
        paths:
          - "Core/"
        target: 43%
        threshold: 1%
        base: auto

      physics:
        paths:
          - "Physics/"
        target: 29%
        threshold: 1%
        base: auto

    # Aerospace/, AI/, and Models/ are close to untested. They are deliberately left
    # without a floor: a 10% target would ratify the gap rather than close it. They
    # need tests, tracked separately, not a status check.
    patch:
      default:
        target: 60%
        threshold: 5%
        base: auto

      # New or changed certification logic must arrive with its tests.
      certification:
        paths:
          - "Certification/"
        target: 90%
        threshold: 5%
        base: auto

comment:
  layout: "reach,diff,flags,tree,reach"
  behavior: default
  require_changes: no

github_checks:
  annotations: true

flags:
  unittests:
    paths:
      - Tests/Unit/
    carryforward: true
  integration:
    paths:
      - Tests/Integration/
    carryforward: true
